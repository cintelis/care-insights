  # ---------------------------------------------------------------- page 4
  - id: devloop
    title: Same SQL, two engines
    subtitle: Transform logic is tested on a laptop with DuckDB before it runs on Fabric Spark
    zones:
      - {id: z_local, label: Local - no cloud cost, x: 40, y: 100, w: 1440, h: 210, colour: green}
      - {id: z_cloud, label: Cloud - ADLS Gen2 + Microsoft Fabric, x: 40, y: 450, w: 1440, h: 210, colour: blue}
    nodes:
      - {id: gen, label: datagen/generate.py, sub: synthetic files + planted problems, kind: worker, zone: z_local, x: 80, y: 180, w: 210, h: 70}
      - {id: lraw, label: data/raw, sub: CSV + JSON Lines, kind: datastore, zone: z_local, x: 380, y: 170, w: 160, h: 90}
      - {id: runl, label: transform/run_local.py, sub: DuckDB + sqlglot (spark > duckdb), kind: worker, zone: z_local, x: 640, y: 180, w: 240, h: 70}
