# Care Insights POC - architecture diagrams (drawgen spec)
# Build:  C:\code\drawio-tools\.venv\Scripts\drawgen build docs\diagrams\care-insights.yaml -o docs\assets\care-insights.drawio.svg
pages:
  # ---------------------------------------------------------------- page 1
  - id: architecture
    title: Care Insights POC - solution architecture
    subtitle: Open lakehouse - ADLS Gen2 holds every layer, Microsoft Fabric is the compute, no Power BI
    zones:
      - {id: z_src, label: Source systems (synthetic), x: 40, y: 100, w: 240, h: 520, colour: grey}
      - {id: z_fabric, label: Microsoft Fabric - workspace care-insights-poc, x: 360, y: 100, w: 760, h: 300, colour: purple}
      - {id: z_azure, label: Azure subscription - rg-care-insights-poc (Australia East), x: 360, y: 460, w: 760, h: 320, colour: blue}
      - {id: z_cons, label: Consumers, x: 1200, y: 100, w: 300, h: 680, colour: teal}
      - {id: z_id, label: Identity - Entra ID (keyless), x: 40, y: 680, w: 240, h: 240, colour: red}
    nodes:
      # sources
      - {id: crm, label: CRM extracts, sub: "participants, workers - CSV", kind: external, zone: z_src, x: 60, y: 160, w: 200}
      - {id: roster, label: Rostering system, sub: bookings - monthly CSV, kind: external, zone: z_src, x: 60, y: 270, w: 200}
      - {id: mobile, label: Worker mobile app, sub: check-in / out - JSON Lines, kind: external, zone: z_src, x: 60, y: 380, w: 200}
      - {id: invoices, label: Provider invoices, sub: CSV - dd/MM/yyyy dates, kind: external, zone: z_src, x: 60, y: 490, w: 200}
      # fabric
      - {id: sched, label: Daily schedule, sub: 06:00 AEST - RunNotebook, kind: step, zone: z_fabric, x: 380, y: 140, w: 180}
      - {id: nb, label: Notebook nb_care_medallion, sub: PySpark - bronze > silver > gold, kind: worker, zone: z_fabric, x: 600, y: 200, w: 280, h: 90}
      - {id: lh, label: Lakehouse lh_care, sub: Files/raw + Files/lake shortcuts, kind: service, zone: z_fabric, x: 940, y: 150, w: 160}
      - {id: sql, label: SQL endpoint, sub: Tables/gold_* shortcuts, kind: service, zone: z_fabric, x: 940, y: 300, w: 160}
      # azure
      - {id: raw, label: raw container, sub: landing zone - files as received, kind: datastore, zone: z_azure, x: 400, y: 520, w: 180, h: 100}
      - {id: lake, label: lake container, sub: bronze / silver / gold Delta + _pipeline SQL, kind: datastore, zone: z_azure, x: 630, y: 520, w: 220, h: 100}
      - {id: cap, label: Fabric capacity F2, sub: paused when idle (~US$0.36/h), kind: service, zone: z_azure, x: 900, y: 690, w: 200}
      # consumers
      - {id: ops, label: Care and finance team, kind: actor, zone: z_cons, x: 1290, y: 150, w: 120, h: 80}
      - {id: dash, label: Care Insights dashboard, sub: Streamlit + DuckDB - no Power BI, kind: ui, zone: z_cons, x: 1230, y: 530, w: 240, h: 76}
      - {id: other, label: Other Delta engines, sub: Databricks - Synapse - Polars, kind: external, zone: z_cons, x: 1230, y: 680, w: 240}
      # identity
      - {id: user, label: Entra user login, sub: uploads + dashboard reads, kind: security, zone: z_id, x: 60, y: 730, w: 200}
      - {id: wsid, label: Workspace identity, sub: Fabric -> ADLS, kind: security, zone: z_id, x: 60, y: 830, w: 200}
      # status
      - {id: status, label: "Status Oct 2026: ADLS, data, pipeline SQL and dashboard deployed + tested. Fabric run pending tenant enablement", kind: note, x: 360, y: 930, w: 760, h: 60}
    edges:
      - {from: z_src, to: raw, label: batch files, style: data, exit: right, entry: left, points: [[320, 360], [320, 570]]}
      - {from: raw, to: nb, label: read via Files/raw, style: data, exit: top, entry: left, points: [[490, 245]]}
      - {from: nb, to: lake, label: read SQL / write Delta via Files/lake, style: data, exit: bottom, entry: top, both: true}
      - {from: sched, to: nb, label: trigger, style: async, exit: right, entry: top, points: [[740, 172]]}
      - {from: lh, to: nb, label: default lakehouse, style: weak, exit: left, entry: right}
      - {from: lh, to: sql, label: gold tables, style: weak, exit: bottom, entry: top}
      - {from: cap, to: z_fabric, label: compute, style: weak, exit: right, entry: right, points: [[1150, 722], [1150, 250]]}
      - {from: lake, to: dash, label: delta_scan (Entra auth), style: data, exit: right, entry: left}
      - {from: lake, to: other, label: open Delta / Parquet, style: weak, exit: bottom, entry: left, points: [[740, 650], [1190, 650], [1190, 712]]}
      - {from: dash, to: ops, label: HTTPS, exit: top, entry: bottom}
      - {from: sql, to: ops, label: ad-hoc T-SQL, style: weak, exit: right, entry: left}
      - {from: user, to: raw, label: upload (azcopy), style: weak, exit: right, entry: bottom, points: [[490, 762]]}
      - {from: wsid, to: z_azure, label: RBAC (no keys), style: weak, exit: right, entry: bottom, points: [[740, 862]]}
    legend: true

  # ---------------------------------------------------------------- page 2
  - id: medallion
    title: Medallion lineage - bronze > silver > gold
    subtitle: Every table is Delta in ADLS (lake container). Silver and gold are plain Spark SQL files, run in order
    zones:
      - {id: z_b, label: "Bronze - raw as Delta", x: 40, y: 100, w: 260, h: 720, colour: amber}
      - {id: z_s, label: "Silver - typed, de-duplicated, conformed", x: 340, y: 100, w: 760, h: 720, colour: grey}
      - {id: z_g, label: "Gold - business answers", x: 1140, y: 100, w: 300, h: 720, colour: green}
    nodes:
      # bronze
      - {id: b_part, label: participants, kind: datastore, zone: z_b, x: 80, y: 160, w: 180, h: 60}
      - {id: b_svc, label: service_types, kind: datastore, zone: z_b, x: 80, y: 250, w: 180, h: 60}
      - {id: b_book, label: bookings, kind: datastore, zone: z_b, x: 80, y: 340, w: 180, h: 60}
      - {id: b_ev, label: visit_events, kind: datastore, zone: z_b, x: 80, y: 430, w: 180, h: 60}
      - {id: b_wk, label: workers, kind: datastore, zone: z_b, x: 80, y: 520, w: 180, h: 60}
      - {id: b_inv, label: invoices, kind: datastore, zone: z_b, x: 80, y: 610, w: 180, h: 60}
      - {id: b_prov, label: providers, kind: datastore, zone: z_b, x: 80, y: 700, w: 180, h: 60}
      # silver - typed 1:1
      - {id: s_part, label: 01 participants, sub: budget as DOUBLE, kind: step, zone: z_s, x: 380, y: 160, w: 200, h: 60}
      - {id: s_svc, label: 04 service_types, sub: price caps, kind: step, zone: z_s, x: 380, y: 250, w: 200, h: 60}
      - {id: s_book, label: 05 bookings, sub: latest version per booking, kind: step, zone: z_s, x: 380, y: 340, w: 200, h: 60}
      - {id: s_ev, label: 06 visit_events, sub: drop mobile retries, kind: step, zone: z_s, x: 380, y: 430, w: 200, h: 60}
      - {id: s_wk, label: 02 workers, kind: step, zone: z_s, x: 380, y: 520, w: 200, h: 60}
      - {id: s_inv, label: 08 invoices, sub: "AU dates, duplicate / cap flags", kind: step, zone: z_s, x: 380, y: 610, w: 200, h: 60}
      - {id: s_prov, label: 03 providers, kind: step, zone: z_s, x: 380, y: 700, w: 200, h: 60}
      # silver - derived
      - {id: s_visits, label: 07 visits, sub: on_time / late / missed / future + cost, kind: step, zone: z_s, x: 640, y: 375, w: 220, h: 70}
      - {id: s_spend, label: 09 spend, sub: visits + accepted invoices, kind: step, zone: z_s, x: 860, y: 600, w: 200, h: 64}
      # gold
      - {id: g_budget, label: budget_utilisation, sub: forecast vs budget per quarter, kind: datastore, zone: z_g, x: 1170, y: 170, w: 240, h: 80}
      - {id: g_rel, label: visit_reliability, sub: daily by region + service, kind: datastore, zone: z_g, x: 1170, y: 350, w: 240, h: 80}
      - {id: g_punct, label: worker_punctuality, sub: "late rate, needs_review flag", kind: datastore, zone: z_g, x: 1170, y: 490, w: 240, h: 80}
      - {id: g_exc, label: invoice_exceptions, sub: one row per problem + $ at risk, kind: datastore, zone: z_g, x: 1170, y: 705, w: 240, h: 80}
    edges:
      - {from: b_part, to: s_part, style: data}
      - {from: b_svc, to: s_svc, style: data}
      - {from: b_book, to: s_book, style: data}
      - {from: b_ev, to: s_ev, style: data}
      - {from: b_wk, to: s_wk, style: data}
      - {from: b_inv, to: s_inv, style: data}
      - {from: b_prov, to: s_prov, style: data}
      - {from: s_book, to: s_visits, style: data, exit: right, entry: left}
      - {from: s_ev, to: s_visits, style: data, exit: right, entry: left}
      - {from: s_svc, to: s_visits, label: price cap, style: weak, exit: right, entry: top, points: [[750, 280]]}
      - {from: s_visits, to: s_spend, label: delivered visits, style: data, exit: bottom, entry: left, points: [[750, 632]]}
      - {from: s_inv, to: s_spend, label: accepted amount, style: data, exit: right, entry: left}
      - {from: s_part, to: g_budget, label: quarterly budget, style: data, exit: right, entry: left, points: [[1100, 190]]}
      - {from: s_spend, to: g_budget, label: spend to date, style: data, exit: top, entry: bottom, points: [[960, 300], [1290, 300]]}
      - {from: s_visits, to: g_rel, label: status per visit, style: data, exit: right, entry: left}
      - {from: s_visits, to: g_punct, label: per worker, style: data, exit: right, entry: left, points: [[1000, 410], [1000, 530]]}
      - {from: s_wk, to: g_punct, label: home region, style: weak, exit: right, entry: bottom, points: [[620, 550], [620, 585], [1290, 585]]}
      - {from: s_inv, to: g_exc, label: flagged invoices, style: data, exit: right, entry: top, points: [[610, 640], [610, 685], [1290, 685]]}
      - {from: s_prov, to: g_exc, label: provider name, style: weak, exit: right, entry: left}
    texts:
      - {id: t_note, label: "Budget forecast = spend to date + in-house visits already booked + invoices at current run rate. Lookups to participants / service_types not all drawn.", x: 40, y: 840, w: 1400, h: 24}
    legend: true

